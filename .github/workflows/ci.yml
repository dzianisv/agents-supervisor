name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Unit tests (core + hook + train derivation)
        run: node --test test/*.test.mjs
      - name: Claude Code hook e2e (fake judge, no creds)
        run: node test/e2e-cc.mjs
      - name: Judge eval (skips without ANTHROPIC creds)
        run: node evals/judge-eval.mjs
      - name: OpenCode plugin syntax check
        run: node --experimental-strip-types --check opencode/supervisor.ts
      - name: Privacy guard — no mined data committed
        run: |
          # Convention: evals/<name>.example.jsonl is a small, committed, synthetic
          # fixture (e.g. evals/cases.example.jsonl, evals/verbosity-cases.example.jsonl).
          # Anything else matching .dataset/transcripts/*.jsonl is private mined data
          # and must never be tracked in git.
          ALLOW='^evals/[A-Za-z0-9_-]+\.example\.jsonl$'
          if git ls-files | grep -E '\.dataset|transcripts|\.jsonl$' | grep -v -E "$ALLOW"; then
            echo "ERROR: private data tracked in git"; exit 1
          fi
          for f in $(git ls-files | grep -E "$ALLOW"); do
            if [ "$(wc -c < "$f")" -gt 51200 ]; then
              echo "ERROR: $f exceeds 50KB — synthetic cases only, mined data is never committed"; exit 1
            fi
          done
          echo "OK: no private data tracked"
